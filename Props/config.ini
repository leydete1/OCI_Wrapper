# =============================================================================
# Connection Pool
# =============================================================================
#
# use_connection_pool = 0  ->  OCI_Connect / OCI_Disconnect  (default)
# use_connection_pool = 1  ->  OCI_Connect_pool / OCI_Disconnect_pool
#
# The Test_XML_Runner command-line argument (--pool / --direct / 1 / 0)
# overrides this setting when supplied.
#
# All pool parameters below are optional; safe defaults are built into
# the code so you only need to set the values you want to change.
# =============================================================================

# Master pool switch  (0=direct  1=pool)
use_connection_pool                 = 1


# -----------------------------------------------------------------------------
# Pool sizing
# -----------------------------------------------------------------------------

# Sessions opened at startup (must be >= 1)
pool_min_size                       = 2

# Maximum concurrent sessions the pool will ever hold
pool_max_size                       = 10

# Number of new sessions opened when the pool needs to grow
pool_increment                      = 1


# -----------------------------------------------------------------------------
# Timeout settings  (all values in seconds)
# -----------------------------------------------------------------------------

# How long OCI_Pool_get_session will block waiting for a free slot
pool_connection_timeout             = 30

# A FREE slot idle longer than this is pinged / recycled on health check
session_idle_timeout                = 300

# Time limit for OCIServerAttach to complete
max_time_to_establish               = 15

# Socket-level read/write timeout (informational - set at OS level if needed)
network_read_write_timeout          = 60

# Maximum time any single query may run  (0 = unlimited)
query_execution_timeout             = 0

# Time allowed for OCISessionBegin to complete
authentication_handshake_timeout    = 10

# Alias for authentication_handshake_timeout (both are read; last one wins)
login_auth_timeout                  = 10

# A session older than this is closed and reopened on health check
session_max_lifetime                = 3600

# Interval at which OCI_Pool_health_check should be called from a
# heartbeat thread  (informational - your heartbeat thread reads this)
heartbeat_keepalive_interval        = 60


# -----------------------------------------------------------------------------
# Retry
# -----------------------------------------------------------------------------

# Number of open / reopen attempts before giving up on a slot
retries_on_connection_failure       = 3


# -----------------------------------------------------------------------------
# Session behaviour
# -----------------------------------------------------------------------------

# Run OCIPing on every slot before handing it to a worker  (0=no  1=yes)
connection_validation_on_borrow     = 1

# Issue OCITransRollback when a session is returned to the pool  (0=no  1=yes)
# Recommended: 1  - ensures no uncommitted work leaks between callers
rollback_on_return_to_pool          = 1

# Set AUTOCOMMIT on each pooled session  (0=off  1=on)
# Leave 0 unless you have a specific reason; explicit commits are safer.
autocommit_mode                     = 0


# -----------------------------------------------------------------------------
# NLS / character set
# These ALTER SESSION statements are run once per slot after OCISessionBegin.
# They apply equally whether or not the pool is in use.
# -----------------------------------------------------------------------------

nls_date_format                     = YYYY-MM-DD HH24:MI:SS
nls_language                        = AMERICAN
nls_territory                       = AMERICA
nls_characterset                    = AL32UTF8
nls_session_timezone                = UTC

# =============================================================================
# Cache configuration - add these blocks to your existing config.ini
# =============================================================================
# Three independent cache instances are supported.  Each has its own
# enable switch, TTL, memory limit, and hash algorithm.
# All three are disabled by default - set _enabled = 1 to activate.
# =============================================================================


# -----------------------------------------------------------------------------
# Result Set Cache
# Caches the OUTPUT_XML from SELECT queries.
# Key: normalised SQL string (uppercased, whitespace collapsed).
# Recommended TTL: short (data changes frequently).
# -----------------------------------------------------------------------------

resultset_cache_enabled            = 1
resultset_cache_ttl_seconds        = 300
resultset_cache_max_entries        = 1000
resultset_cache_max_memory_mb      = 256
resultset_cache_bucket_count       = 2048
resultset_cache_hash_algorithm     = fnv1a    # fnv1a | djb2 | murmur3


# -----------------------------------------------------------------------------
# Metadata Cache
# Caches Oracle column metadata from ALL_TAB_COLUMNS per table.
# Key: OWNER.TABLE_NAME (uppercased).
# Recommended TTL: long (schema changes rarely).
# -----------------------------------------------------------------------------

metadata_cache_enabled             = 1
metadata_cache_ttl_seconds         = 3600
metadata_cache_max_entries         = 500
metadata_cache_max_memory_mb       = 64
metadata_cache_bucket_count        = 512
metadata_cache_hash_algorithm      = fnv1a


# -----------------------------------------------------------------------------
# Statement Cache
# Caches prepared OCI statement handles.
# Key: normalised SQL string.
# Recommended TTL: medium (statements stay valid until DDL change).
# -----------------------------------------------------------------------------

statement_cache_enabled            = 1
statement_cache_ttl_seconds        = 1800
statement_cache_max_entries        = 200
statement_cache_max_memory_mb      = 32
statement_cache_bucket_count       = 256
statement_cache_hash_algorithm     = fnv1a

 # -----------------------------------------------------------------------------
 # Metadata Cache
 # Caches Oracle column metadata from ALL_TAB_COLUMNS per table.
 # Key: OWNER.TABLE_NAME (uppercased).
 # Recommended TTL: long (schema changes rarely).
 # -----------------------------------------------------------------------------
 metadata_cache_enabled             = 1
 metadata_cache_ttl_seconds         = 3600
 metadata_cache_max_entries         = 500
 metadata_cache_max_memory_mb       = 64
 metadata_cache_bucket_count        = 512
 metadata_cache_hash_algorithm      = fnv1a
 
# -----------------------------------------------------------------------------
# Session Cache (in-memory fast-path for session_validate / session_touch)
# -----------------------------------------------------------------------------
session_cache_enabled              = 1
session_cache_ttl_seconds          = 1800
session_cache_max_entries          = 5000
session_cache_max_memory_mb        = 128
session_cache_bucket_count         = 4096
session_cache_hash_algorithm       = fnv1a    

# -----------------------------------------------------------------------------
# Session Manager (permanent OCI_SESSION table)
# -----------------------------------------------------------------------------
session_default_ttl_seconds        = 1800
session_log_create                 = 1
session_log_end                    = 1
session_log_reconcile              = 1

 
 
 # -----------------------------------------------------------------------------
# Transaction Manager
# Controls explicit transaction lifecycle behaviour for OCI_Transaction_Manager.
# All timeout values are in seconds.  Set tx_timeout_seconds = 0 to disable
# idle timeout entirely (not recommended for production).
# -----------------------------------------------------------------------------

# Seconds of client inactivity before an open transaction is automatically
# rolled back and aborted.  0 = no timeout.
tx_timeout_seconds          = 300

# Number of times tx_commit() will retry on a transient OCI error before
# aborting the transaction.
tx_max_retries              = 3

# Milliseconds to wait between commit retry attempts.
tx_retry_delay_ms           = 500

# Log BEGIN events to the transaction log  (0=off  1=on)
tx_log_begin                = 1

# Log COMMIT events to the transaction log  (0=off  1=on)
tx_log_commit               = 1

# Log ROLLBACK events to the transaction log  (0=off  1=on)
tx_log_rollback             = 1

# Log TIMEOUT events to the transaction log  (0=off  1=on)
tx_log_timeout              = 1


# Metrics config  (0=off  1=on)
metrics_display_input_file_name     = 1
metrics_display_input_xml          = 1
metrics_display_output_xml          = 1


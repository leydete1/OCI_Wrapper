# ======================================================================
# consumer_http.ini
#
# HTTP Consumer's own operational/lifecycle config - deliberately a
# separate file from consumer_file.ini, validated independently by
# load_http_consumer_ini() (ini_reader.c), same pattern as
# consumer_file.ini's own separation from config.ini.
#
# Added 2026-08-16 specifically to decouple HTTP Consumer's lifetime
# from File Consumer's dispatcher.lifetime_seconds (consumer_file.ini) -
# the two must never share a value again.
# ======================================================================

# 0 = run forever (external kill only, same convention as File
# Consumer's own dispatcher.lifetime_seconds). > 0 = stop automatically
# after this many seconds - useful for bounded test runs without
# risking a File Consumer test's own lifetime taking HTTP Consumer down
# with it.
http_dispatcher.lifetime_seconds=0

# Stage 4 (2026-08-20) - HTTP consumer's own queue_manager sizing.
# Queue 0 is always the dedicated writer queue (INSERT/UPDATE/DELETE) -
# queue_count must be at least 2, or read traffic has nowhere else to
# go but the writer queue. 5 matches File Consumer's own
# dispatcher.queue_count convention (consumer_file.ini) - not a
# requirement, just consistency.
http_dispatcher.queue_count=5
http_dispatcher.queue_depth=50

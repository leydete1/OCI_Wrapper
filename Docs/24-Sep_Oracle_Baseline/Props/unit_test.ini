# Data Manager - Unit Test configuration
# See Unit_Test_Module_Design_Specification.docx for the full design.
#
# This file is optional. If it is not present alongside config.ini,
# the startup self-test stays disabled by default (2026-08-01
# backward-compatibility decision) - no behaviour change for any
# deployment that predates this feature.

[Unit_Test]

# Whether main() runs the self-test at all before starting the request
# consumer loop.
startup_self_test_enabled=1

# Highest tier run automatically at startup: 1, 2, or 3.
# All three tiers are now fully implemented (65 tests total, as of
# 2026-08-02) - 3 runs the complete catalog.
startup_max_tier=3

# Recommended defaults - see the spec's own Test Tiers section for the
# reasoning behind each one.
startup_halt_on_tier1_fail=1
startup_halt_on_tier2_fail=1
startup_halt_on_tier3_fail=0

# Dedicated table/procedure Tier 3 tests use - never the same objects
# real business data lives in.
test_table_name=UNIT_TEST_FIELD_TEST
test_table_owner=DATA_MANAGER
test_procedure_name=UNIT_TEST_SAMPLE_PROC

# Whether a consolidated PASS/FAIL summary is written to the unit
# test's own dedicated log file (see unit_test_log_file_name below),
# in addition to the detailed per-test messages.
unit_test_log_summary_enabled=1

# The self-test's own dedicated log file (added 2026-08-02) - keeps
# results immediately visible in one place, rather than mixed into
# Data_Manager.log's own, much larger stream.
unit_test_log_file_name=/home/leyden100/eclipse-workspace/OCI_Wrapper/logs/start_unit_tests.log
unit_test_log_file_max_size=10485760
unit_test_log_file_rotation_number=5
unit_test_log_level=DEBUG
